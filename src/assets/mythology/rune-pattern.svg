<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <pattern id="runePattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
    <!-- Simplified Norse runes in a repeating pattern -->
    <g fill="none" stroke="currentColor" stroke-width="0.5">
      <!-- Fehu (wealth) -->
      <path d="M10,10 L10,40 M10,25 L20,10 M10,25 L20,40" />
      <!-- Uruz (strength) -->
      <path d="M30,10 L30,40 C40,35 40,15 30,10" />
      <!-- Thurisaz (protection) -->
      <path d="M45,10 L45,40 M40,25 L50,25" />
    </g>
  </pattern>
  <rect width="100" height="100" fill="url(#runePattern)" />
</svg>